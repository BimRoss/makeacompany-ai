name: Build makeacompany-ai images

permissions:
  contents: read

concurrency:
  # Cancel in-flight runs only for PR iterations. Pushes to main/master
  # and tag pushes never cancel — releases must complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  # Computed once and shared with the gitops release. Standalone job
  # rather than threading through the build jobs — same pattern as
  # job-tracker, see BimRoss/job-tracker#8.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - id: compute
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  frontend:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: geeemoney/makeacompany-ai-frontend
      # Optional LinkedIn Insight ID: fromJSON(toJSON(vars)) avoids IDE "context access" false positives for vars not in the local name list.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_LINKEDIN_PARTNER_ID: ${{ fromJSON(toJSON(vars)).NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
      NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ fromJSON(toJSON(vars)).NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
      NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ fromJSON(toJSON(vars)).NEXT_PUBLIC_BING_SITE_VERIFICATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=build,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Validate GA measurement ID for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "${NEXT_PUBLIC_GA_MEASUREMENT_ID}" ]; then
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID repository variable is required for tagged builds."
            exit 1
          fi

      - name: Compute build version
        id: build_version
        run: |
          # Read by the frontend layout to render <meta name="x-build-version">.
          # The deploy-watcher single-probe path greps for the bare semver here
          # (no v), so strip the tag prefix to match.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          target: production
          # Disables OCI attestation / SBOM indexes; Docker Hub sometimes 400s on attestation layer uploads.
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ env.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_LINKEDIN_PARTNER_ID=${{ env.NEXT_PUBLIC_LINKEDIN_PARTNER_ID }}
            NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION=${{ env.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
            NEXT_PUBLIC_BING_SITE_VERIFICATION=${{ env.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
            NEXT_PUBLIC_BUILD_VERSION=${{ steps.build_version.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ping IndexNow
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          INDEXNOW_KEY: 0aeabbadaf97616033ba6f3611051e56
          SITE_HOST: makeacompany.ai
        run: |
          # Notifies Bing/Copilot/Yandex of URL changes within seconds. Key file
          # at https://${SITE_HOST}/${INDEXNOW_KEY}.txt proves ownership.
          # Best-effort — never block a release on a push hiccup.
          SITEMAP_URLS=$(curl -sS --max-time 10 "https://${SITE_HOST}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's,</?loc>,,g')
          if [ -z "${SITEMAP_URLS}" ]; then
            echo "No URLs in sitemap; skipping IndexNow ping."
            exit 0
          fi
          URL_LIST=$(printf '%s\n' ${SITEMAP_URLS} | jq -R . | jq -s .)
          PAYLOAD=$(jq -n \
            --arg host "${SITE_HOST}" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "https://${SITE_HOST}/${INDEXNOW_KEY}.txt" \
            --argjson urlList "${URL_LIST}" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urlList}')
          echo "Pinging IndexNow with $(echo "${URL_LIST}" | jq 'length') URLs."
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            --max-time 15 \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            -w "\nHTTP %{http_code}\n" || true

  backend:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: geeemoney/makeacompany-ai-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/go.sum

      - name: Go test
        run: cd backend && go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=build,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          provenance: false
          sbom: false
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hands off to the BimRoss canonical reusable workflow. See
  # RELEASING.md at BimRoss/.github for the recipe.
  gitops-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - frontend
      - backend
      - version
    uses: BimRoss/.github/.github/workflows/gitops-release.yml@284735b1763e7d59f9b6e5fad5ee49c016073256 # v1
    secrets: inherit
    with:
      app_slug: makeacompany-ai
      version: ${{ needs.version.outputs.version }}
      images: |
        geeemoney/makeacompany-ai-frontend
        geeemoney/makeacompany-ai-backend
      manifest_paths: |
        admin/apps/makeacompany-ai/frontend.yaml
        admin/apps/makeacompany-ai/backend.yaml
      commit_subject: "release(makeacompany-ai): bump images to ${{ needs.version.outputs.version }}"
